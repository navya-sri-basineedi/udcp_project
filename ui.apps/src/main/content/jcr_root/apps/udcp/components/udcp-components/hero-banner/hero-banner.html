
<sly data-sly-use.hero="com.adobe.aem.guides.udcp.core.models.Hero" />

<section class="hero-banner hero-banner--split"
         data-sly-test="${hero.variant == 'split'}">
    <div class="hero-banner__image">
        <img src="${hero.backgroundImage @ context='uri'}"
             alt="Campus Connect University campus"
             data-sly-test="${hero.backgroundImage}" />
    </div>
    <div class="hero-content">
        <p class="hero-eyebrow">DISCOVER YOUR FUTURE</p>
        <h1>${hero.headline}</h1>
        <p class="hero-description">${hero.description}</p>

        <a href="${hero.buttonLink @ extension='html'}"
           class="hero-button"
           data-sly-test="${hero.buttonLabel}">
            ${hero.buttonLabel}
        </a>
    </div>
</section>

<section class="hero-banner"
         data-sly-test="${hero.variant != 'split'}"
         style="background-image: url('${hero.backgroundImage @ context='uri'}');">
    <div class="hero-content">
        <p class="hero-eyebrow">DISCOVER YOUR FUTURE</p>
        <h1>${hero.headline}</h1>
        <p class="hero-description">${hero.description}</p>

        <a href="${hero.buttonLink @ extension='html'}"
           class="hero-button"
           data-sly-test="${hero.buttonLabel}">
            ${hero.buttonLabel}
        </a>
    </div>
</section>
